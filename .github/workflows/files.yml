name: Files

on: 
  workflow_dispatch:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - name: maak een map aan en een tekstbestand
        run: |
          mkdir -p oefenmap
          echo "dit is mijn eerste bestand." > oefenmap/bericht.txt

      - name: toon de map en de tekst
        run: |
          ls -lah oefenmap
          cat oefenmap/bericht.txt
  
