name: Steps Examples

on:
  workflow_dispatch:

jobs:
  steps-example:
    runs-on: ubuntu-latest
    steps:
      - name: Maak de map
        run: mkdir -p testmachine

      - name: Sla systeeminformatie op
        run: uname -a > testmachine/output.txt

      - name: Lees het bestand
        run: cat testmachine/output.txt

      - name: Toon de mappen en bestanden
        run: ls -alhR
