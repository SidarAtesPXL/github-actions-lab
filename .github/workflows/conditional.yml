name: Conditional

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Kies de omgeving
        required: true
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  show-environment:
    runs-on: ubuntu-latest
    env:
      SELECTED_ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - name: Productiemelding
        if: ${{ github.event.inputs.environment == 'production' }}
        run: echo "Deploying to production!"

      - name: Testmelding
        if: ${{ github.event.inputs.environment == 'development' || github.event.inputs.environment == 'staging' }}
        run: echo "Running in test mode"

      - name: Toon de gekozen omgeving
        if: ${{ always() }}
        run: |
          echo "Gekozen omgeving: $SELECTED_ENVIRONMENT"
